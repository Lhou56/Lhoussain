<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1930"><meta name="description" content="LHOUSSAINE — Control total de negocios: ventas, clientes, productos, servicios y gastos."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><title>LHOUSSAINE — Control Total de Negocios</title>
<style>
:root{--navy:#0b1930;--navy2:#132746;--gold:#e7b84d;--bg:#f3f5f8;--ink:#17243a;--muted:#718096;--line:#e4e9f0;--white:#fff;--green:#17856b;--red:#c24b52}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:var(--navy);color:#dce5f2;padding:24px 16px;display:flex;flex-direction:column;gap:22px}.brand{display:flex;align-items:center;gap:11px;padding:0 7px 18px;border-bottom:1px solid #263a57}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#f8d77c,#c18a22);color:var(--navy);display:grid;place-items:center;font-weight:900;font-size:20px}.brand strong{display:block;color:#fff;letter-spacing:.08em;font-size:15px}.brand small{display:block;color:#e5bf62;font-size:9px;letter-spacing:.11em;margin-top:3px}.nav-label{color:#7f91aa;font-size:10px;text-transform:uppercase;letter-spacing:.13em;padding:0 12px}.nav{display:grid;gap:5px}.nav button{background:transparent;border:0;color:#c4d0e0;padding:11px 12px;text-align:left;border-radius:9px;display:flex;gap:12px;align-items:center;cursor:pointer;font:inherit}.nav button .ico{width:20px;text-align:center;font-size:17px}.nav button:hover,.nav button.active{background:#203654;color:#fff}.nav button.active{box-shadow:inset 3px 0 var(--gold)}.sidebar-foot{margin-top:auto;border-top:1px solid #263a57;padding:15px 7px 0;color:#9eafc5;font-size:11px}.demo-tag{display:inline-flex;align-items:center;gap:6px;background:#fff5d9;color:#825c08;border:1px solid #f1d78e;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:700}.demo-tag:before{content:'';width:6px;height:6px;border-radius:50%;background:#d7a42c}.main{min-width:0}.topbar{height:74px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:16px}.crumb{color:var(--muted);font-size:12px}.topbar-right{display:flex;align-items:center;gap:14px}.company{font-weight:650}.avatar{height:35px;width:35px;border-radius:50%;background:#e8d49b;color:#5e4610;display:grid;place-items:center;font-weight:800}.content{padding:28px 30px 44px;max-width:1500px;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}.pagehead h1{font-size:27px;letter-spacing:-.04em;margin:0 0 6px}.pagehead p{margin:0;color:var(--muted)}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:9px;padding:10px 14px;background:#fff;color:var(--ink);font-weight:650;cursor:pointer;font:inherit}.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}.btn.gold{background:var(--gold);border-color:var(--gold);color:#2d260f}.btn:hover{filter:brightness(.97)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 8px #12213a05}.stat{padding:18px}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.stat-icon{width:34px;height:34px;border-radius:10px;background:#f7edcf;color:#856214;display:grid;place-items:center;font-size:17px}.stat strong{display:block;font-size:25px;letter-spacing:-.04em;margin:11px 0 5px}.stat small{color:var(--muted)}.green{color:var(--green)!important}.red{color:var(--red)!important}.columns{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,.85fr);gap:16px}.panel{padding:19px;margin-bottom:16px;min-width:0}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.panel h2{font-size:15px;margin:0}.subtle{color:var(--muted);font-size:12px}.chart{height:185px;display:flex;align-items:end;gap:12px;padding:15px 5px 0;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 44px,#edf0f5 45px)}.bar-wrap{height:100%;flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:7px}.bar{width:min(32px,70%);background:linear-gradient(180deg,#e8c15f,#bd8b22);border-radius:6px 6px 0 0;min-height:5px}.bar-label{font-size:10px;color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;padding:10px 8px;border-bottom:1px solid var(--line)}td{padding:12px 8px;border-bottom:1px solid #edf0f4}tbody tr:last-child td{border-bottom:0}.right{text-align:right}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#e4f5ed;color:#177457;font-size:10px;font-weight:700}.pill.pending{background:#fff2d2;color:#8b6514}.pill.cancel{background:#fce8e8;color:#a63e44}.quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.quick{border:1px solid var(--line);background:#fff;border-radius:10px;padding:14px 12px;text-align:left;cursor:pointer}.quick span{display:block;font-size:19px;margin-bottom:9px;color:#a47a1e}.quick strong{display:block;font-size:12px}.quick small{color:var(--muted);font-size:11px}.alert{padding:12px;border-radius:9px;background:#fff8e8;border:1px solid #f2e2b8;color:#755817;font-size:12px;margin-top:12px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.field{padding:10px 11px;border:1px solid #dce3ec;border-radius:8px;background:#fff;font:inherit;min-width:0;width:100%;color:var(--ink)}.toolbar .field{max-width:280px}.table-wrap{overflow:auto}.empty{padding:28px;text-align:center;color:var(--muted)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.form-grid label{display:grid;gap:6px;font-size:12px;color:#58667b;font-weight:650}.form-grid .full{grid-column:1/-1}.modal-backdrop{position:fixed;inset:0;background:#0713269c;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal-backdrop.show{display:flex}.modal{width:min(580px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:23px;box-shadow:0 20px 70px #0003}.modal h2{margin:0 0 6px}.modal p{color:var(--muted);margin:0 0 19px;font-size:12px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.toast{position:fixed;bottom:22px;right:22px;background:var(--navy);color:#fff;padding:12px 17px;border-radius:10px;box-shadow:0 6px 22px #0002;display:none;z-index:20}.toast.show{display:block}.menu-toggle{display:none}.footer-note{color:var(--muted);font-size:11px;margin-top:15px}
@media(max-width:1000px){.app{grid-template-columns:210px 1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.content{padding:23px 20px}.topbar{padding:0 20px}.columns{grid-template-columns:1fr}}
@media(max-width:680px){.app{display:block}.sidebar{position:fixed;inset:0 auto 0 0;width:260px;z-index:15;transform:translateX(-105%);transition:transform .2s;box-shadow:10px 0 40px #0002}.sidebar.open{transform:translateX(0)}.menu-toggle{display:inline-block}.topbar{height:62px;padding:0 15px}.content{padding:21px 14px}.pagehead{display:block}.pagehead h1{font-size:24px}.pagehead .actions{margin-top:14px}.stats{gap:9px}.stat{padding:13px}.stat strong{font-size:21px}.stat-top{font-size:11px}.stat-icon{width:29px;height:29px}.columns{display:block}.panel{padding:14px}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.company{display:none}.chart{gap:5px}.topbar-right{gap:8px}}
</style></head>
<body><div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><div class="logo">L</div><div><strong>LHOUSSAINE</strong><small>CONTROL TOTAL DE NEGOCIOS</small></div></div><div class="nav-label">Gestión principal</div><nav class="nav" id="nav"><button class="active" data-page="Inicio"><span class="ico">▦</span>Inicio</button><button data-page="Cuotas"><span class="ico">◷</span>Cuotas</button><button data-page="Ventas"><span class="ico">↗</span>Ventas</button><button data-page="Clientes"><span class="ico">♙</span>Clientes</button><button data-page="Productos"><span class="ico">▣</span>Productos</button><button data-page="Servicios"><span class="ico">⚙</span>Servicios</button><button data-page="Informes"><span class="ico">▥</span>Informes</button><button data-page="Gastos"><span class="ico">−</span>Gastos</button><button data-page="Facturación"><span class="ico">▤</span>Facturación</button></nav><div class="nav-label">Sistema</div><nav class="nav"><button data-page="Equipo"><span class="ico">♧</span>Equipo y permisos</button><button data-page="Configuración"><span class="ico">⚙</span>Configuración</button></nav><div class="sidebar-foot">PROTOTIPO INTERACTIVO · VERSIÓN 0.1<br><br>Datos de demostración guardados en este navegador.</div></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="btn menu-toggle" id="menuToggle">☰</button><div class="crumb">LHOUSSAINE <span style="padding:0 6px">/</span> <span id="crumbPage">Inicio</span></div></div><div class="topbar-right"><span class="demo-tag">Modo demostración</span><span class="company">Mi negocio</span><div class="avatar">LH</div></div></header><div class="content" id="content"></div></main></div><div class="modal-backdrop" id="backdrop"><div class="modal"><h2 id="modalTitle">Añadir</h2><p id="modalDesc">Completa los datos.</p><form id="modalForm"><div id="modalFields" class="form-grid"></div><div class="modal-actions"><button type="button" class="btn" id="cancelModal">Cancelar</button><button type="submit" class="btn primary">Guardar</button></div></form></div></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);const money=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(Number(n)||0);const today=()=>new Date().toISOString().slice(0,10);let page='Inicio';
const state={Clientes:[{id:1,nombre:'Ana García',telefono:'612 345 678',email:'ana@example.com',nota:'Cliente frecuente'},{id:2,nombre:'Carlos López',telefono:'623 456 789',email:'carlos@example.com',nota:''},{id:3,nombre:'Marta Ruiz',telefono:'634 567 890',email:'marta@example.com',nota:''}],Productos:[{id:1,nombre:'Producto A',sku:'PR-001',coste:18,precio:32,stock:24},{id:2,nombre:'Producto B',sku:'PR-002',coste:9,precio:17.5,stock:7},{id:3,nombre:'Producto C',sku:'PR-003',coste:35,precio:59,stock:3}],Servicios:[{id:1,nombre:'Instalación básica',precio:65,descripcion:'Servicio estándar'},{id:2,nombre:'Mantenimiento',precio:40,descripcion:'Revisión y mantenimiento'}],Ventas:[{id:1003,fecha:today(),cliente:'Ana García',concepto:'Producto A × 2',total:64,estado:'Pagada',pago:'Tarjeta'},{id:1002,fecha:today(),cliente:'Carlos López',concepto:'Mantenimiento',total:40,estado:'Pendiente',pago:'Pendiente'},{id:1001,fecha:today(),cliente:'Marta Ruiz',concepto:'Producto B × 3',total:52.5,estado:'Pagada',pago:'Efectivo'}],Gastos:[{id:301,fecha:today(),categoria:'Material',concepto:'Compra de suministros',importe:85},{id:302,fecha:today(),categoria:'Transporte',concepto:'Desplazamiento',importe:18}],Cuotas:[{id:201,cliente:'Carlos López',concepto:'Compra a plazos',total:600,pagado:200,vencimiento:today(),estado:'Pendiente'}],Facturación:[],Equipo:[{id:1,nombre:'Propietario',email:'propietario@demo.local',rol:'Administrador'},{id:2,nombre:'Empleado de ventas',email:'ventas@demo.local',rol:'Ventas'}]};let nextId=500;let filter='';
function save(){try{localStorage.setItem('lhoussaine_demo_v1',JSON.stringify(state))}catch(e){}}try{const saved=localStorage.getItem('lhoussaine_demo_v1');if(saved){const d=JSON.parse(saved);Object.keys(state).forEach(k=>{if(Array.isArray(d[k]))state[k]=d[k]})}}catch(e){}
const cfg={Clientes:{title:'Nuevo cliente',desc:'Añade los datos de contacto.',fields:[['nombre','Nombre completo','text',true],['telefono','Teléfono','tel'],['email','Correo electrónico','email'],['nota','Notas','text']]},Productos:{title:'Nuevo producto',desc:'Define el precio y las existencias.',fields:[['nombre','Nombre del producto','text',true],['sku','Referencia / SKU','text'],['coste','Coste (€)','number'],['precio','Precio de venta (€)','number',true],['stock','Stock inicial','number',true]]},Servicios:{title:'Nuevo servicio',desc:'Añade un servicio a tu catálogo.',fields:[['nombre','Nombre del servicio','text',true],['precio','Precio (€)','number',true],['descripcion','Descripción','text']]},Gastos:{title:'Añadir gasto',desc:'Registra un gasto de tu negocio.',fields:[['fecha','Fecha','date',true],['categoria','Categoría','text',true],['concepto','Concepto','text',true],['importe','Importe (€)','number',true]]},Cuotas:{title:'Nueva cuota',desc:'Crea un seguimiento de cobro.',fields:[['cliente','Cliente','text',true],['concepto','Concepto','text',true],['total','Importe total (€)','number',true],['pagado','Importe ya pagado (€)','number'],['vencimiento','Próximo vencimiento','date',true]]},Equipo:{title:'Invitar empleado (demo)',desc:'Prototipo: no se enviará ninguna invitación real.',fields:[['nombre','Nombre','text',true],['email','Correo electrónico','email',true],['rol','Rol (Administrador, Ventas, Almacén)','text',true]]}};
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||''}</tbody></table></div>`}function empty(msg){return `<div class="empty">${msg}</div>`}function stat(label,val,ico,note){return `<div class="stat"><div class="stat-top"><span>${label}</span><span class="stat-icon">${ico}</span></div><strong>${val}</strong><small>${note}</small></div>`}function action(label,fn=''){return `<button class="btn primary" data-action="${fn}">${label}</button>`}
function dashboard(){const total=state.Ventas.filter(v=>v.estado==='Pagada').reduce((a,v)=>a+Number(v.total),0),expenses=state.Gastos.reduce((a,g)=>a+Number(g.importe),0),owed=state.Ventas.filter(v=>v.estado!=='Pagada').reduce((a,v)=>a+Number(v.total),0)+state.Cuotas.reduce((a,c)=>a+Math.max(0,Number(c.total)-Number(c.pagado)),0);let recent=[...state.Ventas].slice(-5).reverse().map(v=>`<tr><td>#${v.id}</td><td>${esc(v.cliente)}</td><td>${esc(v.concepto)}</td><td>${money(v.total)}</td><td><span class="pill ${v.estado==='Pagada'?'':'pending'}">${v.estado}</span></td></tr>`).join('');let bars=[32,48,39,66,52,82,61];return `<div class="pagehead"><div><h1>Resumen del negocio</h1><p>Bienvenido a tu panel de control. Aquí tienes la actividad registrada.</p></div><div class="actions"><button class="btn" data-action="export">Exportar datos</button><button class="btn primary" data-action="new-sale">＋ Nueva venta</button></div></div><div class="stats">${stat('Ventas pagadas',money(total),'↗','Suma de ventas registradas')}${stat('Gastos registrados',money(expenses),'−','Todos los gastos de ejemplo')}${stat('Pendiente de cobro',money(owed),'◷','Ventas pendientes y cuotas')}${stat('Clientes',state.Clientes.length,'♙','Contactos guardados')}</div><div class="columns"><div><section class="panel"><div class="panel-head"><h2>Actividad de ventas</h2><span class="subtle">Vista ilustrativa · 7 periodos</span></div><div class="chart">${bars.map((b,i)=>`<div class="bar-wrap"><div class="bar" style="height:${b}%"></div><span class="bar-label">${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'][i]}</span></div>`).join('')}</div><p class="footer-note">Gráfico visual de muestra; no representa una serie histórica real.</p></section><section class="panel"><div class="panel-head"><h2>Últimas ventas</h2><button class="btn" data-page="Ventas">Ver todas</button></div>${recent?table(['N.º','Cliente','Concepto','Total','Estado'],recent):empty('Todavía no hay ventas.')}</section></div><div><section class="panel"><div class="panel-head"><h2>Accesos rápidos</h2></div><div class="quick-grid"><button class="quick" data-action="new-sale"><span>＋</span><strong>Nueva venta</strong><small>Registrar una operación</small></button><button class="quick" data-action="new-client"><span>♙</span><strong>Nuevo cliente</strong><small>Crear una ficha</small></button><button class="quick" data-action="new-invoice"><span>▤</span><strong>Nueva factura</strong><small>Preparar documento</small></button><button class="quick" data-action="new-expense"><span>−</span><strong>Añadir gasto</strong><small>Registrar un pago</small></button></div><div class="alert">⚠️ <strong>Stock bajo:</strong> ${state.Productos.filter(p=>Number(p.stock)<=5).length} producto(s) con 5 unidades o menos.</div></section><section class="panel"><div class="panel-head"><h2>Cuotas pendientes</h2><button class="btn" data-page="Cuotas">Consultar</button></div>${state.Cuotas.length?table(['Cliente','Pendiente','Vencimiento'],state.Cuotas.slice(0,4).map(c=>`<tr><td>${esc(c.cliente)}</td><td>${money(c.total-c.pagado)}</td><td>${esc(c.vencimiento)}</td></tr>`).join('')):empty('No hay cuotas.')}</section></div></div>`}
function listing(p){const data=state[p]||[];let headers=[],rows='';if(p==='Clientes'){headers=['Cliente','Teléfono','Correo','Notas'];rows=data.map(x=>`<tr><td><strong>${esc(x.nombre)}</strong></td><td>${esc(x.telefono)}</td><td>${esc(x.email)}</td><td>${esc(x.nota)}</td></tr>`).join('')}if(p==='Productos'){headers=['Producto','Referencia','Coste','Precio','Stock'];rows=data.map(x=>`<tr><td><strong>${esc(x.nombre)}</strong></td><td>${esc(x.sku)}</td><td>${money(x.coste)}</td><td>${money(x.precio)}</td><td><span class="pill ${x.stock<=5?'pending':''}">${x.stock}</span></td></tr>`).join('')}if(p==='Servicios'){headers=['Servicio','Descripción','Precio'];rows=data.map(x=>`<tr><td><strong>${esc(x.nombre)}</strong></td><td>${esc(x.descripcion)}</td><td>${money(x.precio)}</td></tr>`).join('')}if(p==='Gastos'){headers=['Fecha','Categoría','Concepto','Importe'];rows=data.slice().reverse().map(x=>`<tr><td>${esc(x.fecha)}</td><td>${esc(x.categoria)}</td><td>${esc(x.concepto)}</td><td>${money(x.importe)}</td></tr>`).join('')}if(p==='Ventas'){headers=['N.º','Fecha','Cliente','Concepto','Total','Estado'];rows=data.slice().reverse().map(x=>`<tr><td>#${x.id}</td><td>${esc(x.fecha)}</td><td>${esc(x.cliente)}</td><td>${esc(x.concepto)}</td><td>${money(x.total)}</td><td><button class="btn" data-action="toggle-sale" data-id="${x.id}">${x.estado}</button></td></tr>`).join('')}if(p==='Cuotas'){headers=['Cliente','Concepto','Total','Pagado','Pendiente','Vencimiento'];rows=data.map(x=>`<tr><td>${esc(x.cliente)}</td><td>${esc(x.concepto)}</td><td>${money(x.total)}</td><td>${money(x.pagado)}</td><td>${money(x.total-x.pagado)}</td><td>${esc(x.vencimiento)}</td></tr>`).join('')}if(p==='Equipo'){headers=['Nombre','Correo','Rol'];rows=data.map(x=>`<tr><td>${esc(x.nombre)}</td><td>${esc(x.email)}</td><td><span class="pill pending">${esc(x.rol)}</span></td></tr>`).join('')}return `<div class="pagehead"><div><h1>${p}</h1><p>${({Clientes:'Gestiona tus contactos y consulta sus datos.',Productos:'Controla precios, costes y existencias.',Servicios:'Administra tu catálogo de servicios.',Gastos:'Registra los gastos de tu actividad.',Ventas:'Consulta y actualiza las ventas registradas.',Cuotas:'Controla vencimientos, pagos y saldos pendientes.',Equipo:'Vista de ejemplo de usuarios y roles.'})[p]||''}</p></div><div class="actions">${p==='Ventas'?'<button class="btn" data-action="export">Exportar CSV</button>':''}${cfg[p]?action('＋ Añadir',`add-${p}`):''}</div></div><section class="panel"><div class="toolbar"><input class="field" id="search" placeholder="Buscar en ${p.toLowerCase()}…"><span class="subtle" style="align-self:center">${data.length} registro(s)</span></div><div id="listTable">${rows?table(headers,rows):empty('No hay registros para mostrar.')}</div><div class="footer-note">Los cambios de este prototipo se guardan localmente en este navegador.</div></section>`}
function invoices(){const rows=state.Facturación.map(x=>`<tr><td>${esc(x.numero)}</td><td>${esc(x.fecha)}</td><td>${esc(x.cliente)}</td><td>${money(x.total)}</td><td><button class="btn" data-action="print-invoice" data-id="${x.id}">Ver / imprimir</button></td></tr>`).join('');return `<div class="pagehead"><div><h1>Facturación</h1><p>Prepara documentos PDF de demostración y consulta los documentos creados.</p></div><div class="actions"><button class="btn primary" data-action="new-invoice">＋ Nueva factura</button></div></div><section class="panel"><div class="alert">Este prototipo genera una vista imprimible básica. No valida requisitos fiscales ni constituye un sistema de facturación certificado.</div>${rows?table(['N.º documento','Fecha','Cliente','Total','Acciones'],rows):empty('Aún no has creado facturas en esta sesión.')}</section>`}
function reports(){const sales=state.Ventas.reduce((a,x)=>a+Number(x.total),0),costs=state.Gastos.reduce((a,x)=>a+Number(x.importe),0);return `<div class="pagehead"><div><h1>Informes</h1><p>Resumen calculado a partir de los datos presentes en este prototipo.</p></div><div class="actions"><button class="btn primary" data-action="export">Exportar datos</button></div></div><div class="stats">${stat('Ventas registradas',money(sales),'↗','Incluye pendientes')}${stat('Gastos',money(costs),'−','Suma de gastos')}${stat('Diferencia simple',money(sales-costs),'＝','No equivale a beneficio contable')}${stat('Operaciones',state.Ventas.length,'▤','Número de ventas')}</div><section class="panel"><h2>Resumen por módulo</h2>${table(['Módulo','Registros'],Object.keys(state).map(k=>`<tr><td>${k}</td><td>${state[k].length}</td></tr>`).join(''))}<div class="footer-note">No se calculan aquí impuestos, coste real de mercancía, amortizaciones ni resultado fiscal.</div></section>`}
function settings(){return `<div class="pagehead"><div><h1>Configuración</h1><p>Preferencias iniciales de la experiencia LHOUSSAINE.</p></div></div><section class="panel"><h2 style="margin-bottom:14px">Identidad del negocio</h2><div class="form-grid"><label>Nombre comercial<input class="field" value="LHOUSSAINE" id="businessName"></label><label>Moneda<select class="field"><option>EUR — Euro</option><option>USD — Dólar estadounidense</option><option>MAD — Dirham marroquí</option></select></label><label>Idioma<select class="field"><option>Español</option></select></label><label>Estilo visual<select class="field"><option>Azul oscuro y dorado</option></select></label></div><div class="alert">El inicio de sesión real, las funciones de permisos, la sincronización entre dispositivos y las copias en la nube aún no están implementados.</div><div style="margin-top:15px"><button class="btn primary" data-action="backup">Descargar copia de datos demo</button></div></section>`}
function render(){ $('#crumbPage').textContent=page;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let html=page==='Inicio'?dashboard():page==='Facturación'?invoices():page==='Informes'?reports():page==='Configuración'?settings():listing(page);$('#content').innerHTML=html;$('#sidebar').classList.remove('open') }
function openModal(kind){let c=cfg[kind];if(!c)return;$('#modalTitle').textContent=c.title;$('#modalDesc').textContent=c.desc;$('#modalFields').innerHTML=c.fields.map(([name,label,type,req])=>`<label class="${name==='nota'||name==='descripcion'?'full':''}">${label}<input class="field" name="${name}" type="${type}" ${req?'required':''} ${name==='fecha'||name==='vencimiento'?'value="'+today()+'"':''} ${type==='number'?'step="0.01" min="0"':''}></label>`).join('');$('#modalForm').dataset.kind=kind;$('#backdrop').classList.add('show')}
function newSale(){const clients=state.Clientes.map(c=>`<option>${esc(c.nombre)}</option>`).join('');const products=state.Productos.map(p=>`<option value="${p.id}" data-price="${p.precio}" data-name="${esc(p.nombre)}">${esc(p.nombre)} — ${money(p.precio)} (stock ${p.stock})</option>`).join('');$('#modalTitle').textContent='Registrar venta';$('#modalDesc').textContent='Registra una venta de demostración. No se procesa ningún pago real.';$('#modalFields').innerHTML=`<label>Cliente<select class="field" name="cliente">${clients}<option>Cliente ocasional</option></select></label><label>Producto<select class="field" name="producto">${products}</select></label><label>Cantidad<input class="field" name="cantidad" type="number" min="1" value="1" required></label><label>Método de pago<select class="field" name="pago"><option>Efectivo</option><option>Tarjeta</option><option>Transferencia</option><option>Pendiente</option></select></label><label class="full">Fecha<input class="field" name="fecha" type="date" value="${today()}" required></label>`;$('#modalForm').dataset.kind='Venta';$('#backdrop').classList.add('show')}
function newInvoice(){const clients=state.Clientes.map(c=>`<option>${esc(c.nombre)}</option>`).join('');$('#modalTitle').textContent='Nueva factura (demo)';$('#modalDesc').textContent='Crea un borrador imprimible de ejemplo; no es una factura fiscal validada.';$('#modalFields').innerHTML=`<label>Cliente<select class="field" name="cliente">${clients}<option>Cliente ocasional</option></select></label><label>Concepto<input class="field" name="concepto" required placeholder="Producto o servicio"></label><label>Importe (€)<input class="field" name="total" type="number" min="0" step="0.01" required></label><label>Fecha<input class="field" name="fecha" type="date" value="${today()}" required></label>`;$('#modalForm').dataset.kind='Factura';$('#backdrop').classList.add('show')}
function closeModal(){$('#backdrop').classList.remove('show')}$('#cancelModal').onclick=closeModal;$('#menuToggle').onclick=()=>$('#sidebar').classList.toggle('open');
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){page=nav.dataset.page;render();return}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a.startsWith('add-'))openModal(a.slice(4));else if(a==='new-sale')newSale();else if(a==='new-client')openModal('Clientes');else if(a==='new-expense')openModal('Gastos');else if(a==='new-invoice')newInvoice();else if(a==='export'||a==='backup')exportData();else if(a==='toggle-sale'){const v=state.Ventas.find(x=>x.id==b.dataset.id);if(v){v.estado=v.estado==='Pagada'?'Pendiente':'Pagada';save();render();toast('Estado actualizado en los datos de demostración.')}}else if(a==='print-invoice'){const v=state.Facturación.find(x=>x.id==b.dataset.id);if(v)printInvoice(v)}});
$('#modalForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.currentTarget),kind=e.currentTarget.dataset.kind;const val=k=>f.get(k);if(kind==='Venta'){const p=state.Productos.find(x=>x.id==val('producto'));const qty=Math.max(1,Number(val('cantidad')));if(!p)return;const v={id:++nextId,fecha:val('fecha'),cliente:val('cliente'),concepto:p.nombre+' × '+qty,total:Number(p.precio)*qty,estado:val('pago')==='Pendiente'?'Pendiente':'Pagada',pago:val('pago')};p.stock=Math.max(0,Number(p.stock)-qty);state.Ventas.push(v);save();closeModal();render();toast('Venta de demostración guardada.')}else if(kind==='Factura'){const v={id:++nextId,numero:'DEMO-'+String(nextId).padStart(5,'0'),fecha:val('fecha'),cliente:val('cliente'),concepto:val('concepto'),total:Number(val('total'))};state.Facturación.push(v);save();closeModal();page='Facturación';render();toast('Borrador de factura creado.')}else{const obj={id:++nextId};for(const [k,v] of f.entries())obj[k]=['coste','precio','stock','importe','total','pagado'].includes(k)?Number(v)||0:v;if(kind==='Cuotas'){obj.pagado=obj.pagado||0;obj.estado='Pendiente'}state[kind].push(obj);save();closeModal();render();toast('Registro guardado en el prototipo.')}});
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='lhoussaine-datos-demo.json';a.click();URL.revokeObjectURL(url);toast('Se ha preparado una copia local de los datos demo.')}function printInvoice(v){const w=window.open('','_blank');if(!w){toast('Permite ventanas emergentes para imprimir.');return}w.document.write(`<html lang="es"><meta charset="utf-8"><title>${esc(v.numero)}</title><body style="font:16px Arial;padding:40px;color:#17243a"><h1 style="color:#102746">LHOUSSAINE</h1><h2>Documento de demostración</h2><p><b>Número:</b> ${esc(v.numero)}<br><b>Fecha:</b> ${esc(v.fecha)}<br><b>Cliente:</b> ${esc(v.cliente)}</p><hr><p>${esc(v.concepto)}</p><h2>Total: ${money(v.total)}</h2><p style="margin-top:40px;color:#9a5a00">DOCUMENTO DE PRUEBA — NO ES UNA FACTURA FISCAL VALIDADA</p><script>window.print()<\/script></body></html>`);w.document.close()}
$('#search')?.addEventListener('input',()=>{});document.addEventListener('input',e=>{if(e.target.id!=='search')return;const q=e.target.value.toLowerCase();const p=page;const rows=Array.from($('#listTable')?.querySelectorAll('tbody tr')||[]);rows.forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'':'none')});render();
// PWA: registra el service worker para permitir la carga de la app sin conexión tras la primera visita.
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(err => console.warn('No se pudo registrar el service worker:', err))); }
</script></body></html>
